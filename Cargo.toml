[package]
name = "kutuphane_takip_pro"
version = "2.0.0"
edition = "2021"
authors = ["Halil Karakaya"]
description = "Kütüphane Takip Sistemi Pro"
license = "AGPL-3.0-only"
repository = "https://github.com/avhalilkarakaya/Kutuphane-Takip-Sistemi-Pro"
build = "build.rs"
publish = false

[[bin]]
name = "Kutuphane_Takip_Sistemi_Pro"
path = "src/main.rs"

[dependencies]
# SQLite kaynak kodu derlenip exe'ye gömülür (ayrı DLL gerekmez)
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# EPUB dosyalarını açmak için
zip = { version = "2", default-features = false, features = ["deflate"] }
# Bağımsız pencere (Windows'ta Microsoft Edge WebView2)
wry = "0.50"
tao = "0.32"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# "localtest" yalnızca geliştirme sırasında arayüzü denemek için kullanılan derleme ayarıdır
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(localtest)'] }
