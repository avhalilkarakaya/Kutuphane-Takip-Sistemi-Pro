# Her yüklemede exe dosyalarını derler (Actions > son çalıştırma > "Artifacts").
# "v" ile başlayan bir etiket (ör. v2.0.0) yüklendiğinde ayrıca herkesin indirebileceği
# bir sürüm (Releases) oluşturur ve exe dosyalarını oraya ekler.
name: Windows exe derle

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            suffix: 64bit
          - target: i686-pc-windows-msvc
            suffix: 32bit
    steps:
      - uses: actions/checkout@v4
      - name: Rust hedefini ekle
        run: rustup target add ${{ matrix.target }}
      - name: Rust kütüphanelerinin lisanslarını topla
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File lisanslar.ps1 static\lisanslar\rust ${{ matrix.target }}
      - name: Derle
        run: cargo build --release --target ${{ matrix.target }}
      - name: Exe dosyasını hazırla
        shell: cmd
        run: copy target\${{ matrix.target }}\release\Kutuphane_Takip_Sistemi_Pro.exe Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}
          path: Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dagitim
          merge-multiple: true
      - name: Sağlama toplamlarını hesapla
        working-directory: dagitim
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dagitim/*.exe dagitim/SHA256SUMS.txt
          --title "Kütüphane Takip Sistemi Pro $GITHUB_REF_NAME"
          --notes-file .github/SURUM_NOTLARI.md
