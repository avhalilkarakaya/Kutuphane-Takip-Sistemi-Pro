# Her yüklemede exe dosyalarını derler (Actions > son çalıştırma > "Artifacts").
# main dalına yüklenen koddaki sürüm numarası (Cargo.toml) henüz yayımlanmamışsa, ya da
# "v" ile başlayan bir etiket yüklenirse, herkesin indirebileceği bir sürüm (Releases)
# oluşturur ve exe dosyalarını oraya ekler.
name: Windows exe derle

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            suffix: 64bit
          - target: i686-pc-windows-msvc
            suffix: 32bit
    steps:
      - uses: actions/checkout@v4
      - name: Rust hedefini ekle
        run: rustup target add ${{ matrix.target }}
      - name: Rust kütüphanelerinin lisanslarını topla
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File lisanslar.ps1 static\lisanslar\rust ${{ matrix.target }}
      - name: Derle
        run: cargo build --release --target ${{ matrix.target }}
      - name: Exe dosyasını hazırla
        shell: cmd
        run: copy target\${{ matrix.target }}\release\Kutuphane_Takip_Sistemi_Pro.exe Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}
          path: Kutuphane_Takip_Sistemi_Pro_${{ matrix.suffix }}.exe

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarasını belirle
        id: surum
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            etiket="$GITHUB_REF_NAME"
          else
            etiket="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "etiket=$etiket" >> "$GITHUB_OUTPUT"
          if gh release view "$etiket" > /dev/null 2>&1; then
            echo "$etiket zaten yayımlanmış, yeni sürüm oluşturulmuyor."
            echo "yayimli=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.surum.outputs.yayimli != '1'
        with:
          path: dagitim
          merge-multiple: true
      - name: Sağlama toplamlarını hesapla
        if: steps.surum.outputs.yayimli != '1'
        working-directory: dagitim
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Sürümü yayımla
        if: steps.surum.outputs.yayimli != '1'
        run: >
          gh release create "${{ steps.surum.outputs.etiket }}" dagitim/*.exe dagitim/SHA256SUMS.txt
          --target "$GITHUB_SHA"
          --title "Kütüphane Takip Sistemi Pro ${{ steps.surum.outputs.etiket }}"
          --notes-file .github/SURUM_NOTLARI.md
